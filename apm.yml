name: ingredient-matching-game
version: 1.0.0
description: Tamil-first ingredient puzzle game with full APM integration
author: Raghupathy
license: MIT

# ── Runtime configuration ──────────────────────────────────────────────────────
runtime:
  node: ">=18.0.0"
  timeout: 5000
  retries: 2

# ── Agents ─────────────────────────────────────────────────────────────────────
# Each agent is an AI model (Claude Code session or Copilot) with assigned tools
# and a system prompt. Tools reference MCP tool names from mcp_servers below.
# Claude Code reads this via .mcp.json; Copilot reads via copilot-extension/.
agents:
  - name: hint-agent
    type: claude
    model: claude-sonnet-4-6
    description: Gives contextual clues without naming the missing ingredient
    mcp_tools:
      - get_hint
      - get_cultural_context
      - get_dish_info
    instructions: ./prompts/hint-generator.md

  - name: cultural-agent
    type: claude
    model: claude-sonnet-4-6
    description: Explains Tamil and South Indian dish heritage and traditions
    mcp_tools:
      - get_cultural_context
      - get_dish_info
      - list_dishes
    instructions: ./prompts/cultural-context.md

  - name: scoring-agent
    type: claude
    model: claude-sonnet-4-6
    description: Validates answers and delivers warm end-of-round feedback
    mcp_tools:
      - validate_answer
      - update_score
      - get_leaderboard
      - get_player_stats
    instructions: ./prompts/feedback-generator.md
    depends_on:
      - hint-agent

  - name: difficulty-agent
    type: claude
    model: claude-sonnet-4-6
    description: Monitors player performance and recommends difficulty adjustments
    mcp_tools:
      - adjust_difficulty
      - get_difficulty_recommendation
      - get_player_stats
    instructions: ./prompts/difficulty-advisor.md
    depends_on:
      - scoring-agent

  - name: game-agent
    type: claude
    model: claude-sonnet-4-6
    description: Orchestrates full game flow — start, rounds, hints, scoring, leaderboard
    mcp_tools:
      - start_game
      - reset_game
      - random_dish
      - list_dishes
      - get_leaderboard
    instructions: |
      You are a Tamil food game master for the Ingredient Matching Game.
      Help players start sessions, pick dishes, navigate rounds, and celebrate their scores.
      Prefer Tamil Nadu dishes when suggesting what to play next.
      Respond warmly, as if you are a knowledgeable Tamil food enthusiast.
    depends_on:
      - hint-agent
      - scoring-agent
      - cultural-agent
      - difficulty-agent

# ── Skills ─────────────────────────────────────────────────────────────────────
skills:
  - name: ingredient-matcher
    version: "1.0.0"
    path: ./skills/ingredient-matcher.js
    description: Fuzzy and exact ingredient/dish-name matching using Levenshtein distance
    exports:
      - fuzzyMatch
      - exactMatch
      - normalizeIngredient
    depends_on: []

  - name: score-calculator
    version: "1.0.0"
    path: ./skills/score-calculator.js
    description: Computes round score with time bonus, difficulty multiplier, and hint penalties
    exports:
      - calculateScore
      - applyPenalty
    depends_on: []

  - name: game-validator
    version: "1.0.0"
    path: ./skills/game-validator.js
    description: Validates ingredient tile selections and dish name guesses against correct answers
    exports:
      - validateIngredients
      - validateDishName
    depends_on:
      - ingredient-matcher

  - name: difficulty-scaler
    version: "1.0.0"
    path: ./skills/difficulty-scaler.js
    description: Dynamically adjusts tile count, decoy quality, and recommends difficulty changes
    exports:
      - scaleTiles
      - getDecoySet
      - recommendDifficulty
    depends_on:
      - score-calculator

  - name: dish-randomizer
    version: "1.0.0"
    path: ./skills/dish-randomizer.js
    description: Selects rounds without repetition, weighted 3x toward Tamil dishes
    exports:
      - pickRound
      - resetHistory
    depends_on: []

  - name: cultural-tagger
    version: "1.0.0"
    path: ./skills/cultural-tagger.js
    description: Returns cultural region, Tamil script name, and fun fact for a dish
    exports:
      - getTag
      - getTamilName
      - getFunFact
    depends_on: []

# ── Prompts ────────────────────────────────────────────────────────────────────
prompts:
  - name: hint-generator
    version: "1.0.0"
    path: ./prompts/hint-generator.md
    description: One-line ingredient hint without naming the ingredient directly
    variables:
      - dish_name
      - tamil_name
      - region
      - found_ingredients
      - missing_count

  - name: dish-guesser
    version: "1.0.0"
    path: ./prompts/dish-guesser.md
    description: Dish-name clue based on ingredient list without revealing the answer
    variables:
      - ingredients
      - player_guess
      - difficulty

  - name: cultural-context
    version: "1.0.0"
    path: ./prompts/cultural-context.md
    description: 2-3 sentence cultural background for a Tamil or Indian dish
    variables:
      - dish_name
      - tamil_name
      - region

  - name: difficulty-advisor
    version: "1.0.0"
    path: ./prompts/difficulty-advisor.md
    description: Recommends difficulty adjustment based on recent performance
    variables:
      - recent_scores
      - current_difficulty
      - rounds_played

  - name: feedback-generator
    version: "1.0.0"
    path: ./prompts/feedback-generator.md
    description: Warm end-of-round feedback in Tamil grandmother style
    variables:
      - dish_name
      - score
      - time_remaining
      - mistakes

# ── MCP Servers ────────────────────────────────────────────────────────────────
mcp_servers:
  - name: game-state-server
    version: "1.0.0"
    path: ./mcp-server/src/index.ts
    description: Full game state, scoring, leaderboard, and dish catalog management
    transport: stdio
    tools:
      - start_game
      - validate_answer
      - reset_game
      - get_hint
      - get_cultural_context
      - update_score
      - get_leaderboard
      - get_player_stats
      - get_dish_info
      - list_dishes
      - random_dish
      - adjust_difficulty
      - get_difficulty_recommendation
    resources:
      - "game://session/{id}"
      - "game://leaderboard"
      - "game://dishes"
      - "game://stats/{playerId}"

# ── Hooks ──────────────────────────────────────────────────────────────────────
hooks:
  pre_skill:
    - name: validate-input
      skill: "*"
      description: Sanitize string inputs and log skill invocation with timestamp
  post_skill:
    - name: log-result
      skill: "*"
      description: Log execution time and result summary for observability
  pre_prompt:
    - name: inject-context
      prompt: "*"
      description: Inject current dish culture tag into prompt variables automatically
  post_prompt:
    - name: cache-response
      prompt: hint-generator
      description: Cache hint response keyed by (sessionId, roundIndex) for 60 seconds

# ── Middleware ─────────────────────────────────────────────────────────────────
middleware:
  - name: rate-limiter
    type: request
    config:
      max_requests: 30
      window_seconds: 60
    description: Prevent hint-farming and score manipulation via rapid API calls
  - name: response-formatter
    type: response
    description: Wrap all skill and prompt outputs in { success, data, meta } envelope

# ── Environment ────────────────────────────────────────────────────────────────
env:
  BACKEND_PORT: 3002
  MCP_SERVER_PATH: ./mcp-server/src/index.ts
  DEFAULT_DIFFICULTY: easy
  MAX_LEADERBOARD_SIZE: 10
  HINT_PENALTY_POINTS: 10
  TAMIL_DISH_WEIGHT: 3
  ROUNDS_PER_GAME: 5
