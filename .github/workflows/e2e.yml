name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: hashFiles('frontend/playwright.config.ts') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            frontend/node_modules
            backend/node_modules
            mcp-server/node_modules
            copilot-extension/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

      - name: Start backend
        run: npm run dev --workspace=backend &
        env:
          NODE_ENV: test

      - name: Serve frontend
        run: npx serve frontend/dist -p 5173 &

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3002/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... attempt $i"
            sleep 2
          done

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            echo "Waiting for frontend... attempt $i"
            sleep 2
          done

      - name: Run E2E tests
        run: npm run test:e2e --workspace=frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
